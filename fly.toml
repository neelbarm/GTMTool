# Fly.io config. `fly launch --copy-config` then `fly volumes create lineup_data --size 1` and `fly deploy`.
app = "lineup"
primary_region = "iad"

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"
  TRUST_PROXY = "1"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  min_machines_running = 1

[[mounts]]
  source = "lineup_data"
  destination = "/data"
