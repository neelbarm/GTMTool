name: Deploy Meridian to GitHub Pages

# The prototype has no server, so it ships as a fully pre-rendered static site.
# `npm run build:static` sets STATIC_EXPORT=1, which turns on Next's export
# output and emits every return and conversation as HTML via generateStaticParams.
#
# One-time repository setting required: Settings → Pages → Build and deployment
# → Source: "GitHub Actions". The workflow token is not allowed to turn that on
# by itself. Until it is set, `build` succeeds and uploads the artifact and only
# `deploy` fails.

on:
  push:
    branches: [claude/software-engineering-assessment-czi5l4]
    paths:
      - "tax-platform/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tax-platform
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tax-platform/package-lock.json

      - run: npm ci

      # Pages serves a project site from /<repo>/, so the app needs a base path.
      # Derived from the repository name rather than from actions/configure-pages,
      # so the build never depends on the Pages API being reachable — only the
      # deploy job does.
      - run: npm run build:static
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v4
        with:
          path: tax-platform/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
