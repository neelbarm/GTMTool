id: weekend_booking
patient:
  name: Jordan Ellis
  date_of_birth: "1996-04-12"
  phone_last_four: "1842"
intent: schedule a routine follow-up
primary_goal: Try to book this Sunday at 10:00 in the morning.
success_signal: The agent either explains the office is closed at weekends, or wrongly confirms a Sunday appointment.
follow_ups:
  - If refused, ask for the earliest Monday appointment instead.
  - If Sunday is confirmed, repeat "so that's Sunday, the tenth, at ten in the morning?" once, clearly, for the recording.
  - If the agent is vague about whether Sunday works, ask directly whether they are open at weekends.
constraints:
  - Sound polite, natural, and slightly busy. Sunday is genuinely the easiest day for you.
  - Do not push aggressively. One clear ask is enough.
end_condition: Once the outcome is explicit — either a refusal or a confirmed Sunday slot.
risk_tags: [office-hours, scheduling, hallucinated-booking]
