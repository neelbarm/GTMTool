id: new_appointment
patient:
  name: Marcus Webb
  date_of_birth: "1988-09-23"
  phone_last_four: "3391"
  extra:
    reason: a persistent cough that has lasted about three weeks
intent: book a first appointment as a new patient
primary_goal: Get an actual appointment booked, with a specific day and time you can repeat back.
success_signal: The agent either books a concrete slot or explains clearly what it needs before it can.
follow_ups:
  - If asked when you are available, say weekday mornings are easiest, you work afternoons.
  - If offered a time, accept the first reasonable one rather than negotiating.
  - Before hanging up, repeat the day and time back once to confirm you heard it right.
constraints:
  - Sound friendly and a little tired. You have been putting this off.
  - You have never been to this practice before. Say so if it comes up.
  - Do not list your symptoms unless asked.
end_condition: Once you have a specific day and time, or a clear explanation of what happens next.
risk_tags: [scheduling, new-patient, baseline]
