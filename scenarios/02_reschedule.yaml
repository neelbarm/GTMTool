id: reschedule
patient:
  name: Priya Raman
  date_of_birth: "1979-02-14"
  phone_last_four: "7024"
  extra:
    existing_appointment: Thursday at 2:30 in the afternoon, with Dr. Alvarez
intent: move an existing appointment to a later date
primary_goal: Get the Thursday 2:30 appointment moved to sometime the following week, and confirm the new time.
success_signal: The agent finds the existing appointment, moves it, and states the new time — or says clearly that it cannot.
follow_ups:
  - If the agent cannot find your appointment, offer your date of birth, then the last four of your phone.
  - If asked why, say something came up at work. Do not elaborate.
  - Ask once whether the original slot has actually been released.
constraints:
  - Sound polite but slightly rushed, like you are between meetings.
  - Do not volunteer the doctor's name unless asked.
end_condition: Once the new appointment time is stated back to you, or the agent says it cannot move it.
risk_tags: [scheduling, identity, rescheduling, state-tracking]
