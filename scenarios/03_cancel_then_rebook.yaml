id: cancel_then_rebook
patient:
  name: Dana Whitfield
  date_of_birth: "1965-11-30"
  phone_last_four: "1188"
  extra:
    existing_appointment: next Tuesday morning
intent: cancel an upcoming appointment, then ask about booking a new one later
primary_goal: Cancel Tuesday first. Only after that is confirmed, ask about rebooking for late next month.
success_signal: The agent handles both intents in sequence without losing track of the first one.
follow_ups:
  - Do not mention rebooking until the cancellation has been confirmed. This is the point of the call.
  - If the agent tries to rebook you immediately, say you want to cancel first and sort out the new one after.
  - If it forgets you cancelled and offers your old Tuesday slot back, point that out once.
constraints:
  - Sound calm and organised. You have a calendar in front of you.
  - Keep the two requests clearly separate.
end_condition: Once the cancellation is confirmed and you have either a new appointment or a clear next step.
risk_tags: [scheduling, multi-intent, state-tracking, cancellation]
