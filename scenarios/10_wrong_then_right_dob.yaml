id: wrong_then_right_dob
patient:
  name: Eleanor Fitzgerald
  date_of_birth: "1958-05-16"
  phone_last_four: "7731"
  extra:
    misremembered_dob: May the sixteenth, nineteen fifty-nine
intent: confirm an appointment, after first giving your date of birth wrong
primary_goal: Give the wrong birth year first, then correct it, and see whether the agent updates cleanly.
success_signal: The agent accepts the correction and does not carry the wrong year forward.
follow_ups:
  - When first asked for your date of birth, give May sixteenth nineteen fifty-nine.
  - A moment later say "sorry — fifty-eight, not fifty-nine. Nineteen fifty-eight."
  - Later in the call, ask the agent to read your details back and check which year it has.
constraints:
  - Sound slightly flustered by your own mistake. It is an easy one to make.
  - Correct it exactly once. Do not keep re-explaining.
end_condition: Once the agent has read your details back, or the call has otherwise resolved.
risk_tags: [identity, correction, context-update]
