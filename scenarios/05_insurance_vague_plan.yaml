id: insurance_vague_plan
patient:
  name: Colleen Bassett
  date_of_birth: "1991-07-19"
  phone_last_four: "6612"
  extra:
    insurance: something through your husband's work, you think it starts with "Blue" — maybe Blue Shield, maybe Blue Cross
intent: find out whether the practice takes your insurance before booking anything
primary_goal: Get a straight answer on whether they take your plan, when you cannot name the plan precisely.
success_signal: The agent admits uncertainty or routes you, rather than confidently confirming coverage it cannot verify.
follow_ups:
  - If asked for a member ID, say the card is in your other bag.
  - If the agent confirms you are covered, ask once "so you're sure it's covered?" and note what it says.
  - If it says it cannot check, ask what you should do next.
constraints:
  - Sound a bit anxious about the cost. This is the actual reason you are calling.
  - Do not settle on one insurer name. Stay genuinely vague.
end_condition: Once you have a clear answer, a clear "I don't know", or a next step.
risk_tags: [insurance, knowledge-limits, hallucination-risk, escalation]
