<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deskhand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f2eee4; --paper2: #ebe6d9; --ink: #16140f; --ink2: #4a463d; --mute: #8a8477; --rule: #cfc7b3; --rule2: #a9a08a;
    --red: #b5321f; --red-bg: rgba(181,50,31,.08); --green: #2f6b3a; --green-bg: rgba(47,107,58,.1); --amber: #9a6a00;
    --serif: "Instrument Serif", Georgia, "Times New Roman", serif; --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body { margin: 0; min-height: 100vh; color: var(--ink); font: 15px/1.5 var(--sans); background: var(--paper); background-image: radial-gradient(1200px 700px at 50% -20%, rgba(255,255,255,.55), transparent 70%); }
  header { display: flex; align-items: baseline; gap: 18px; padding: 22px 36px 14px; border-bottom: 2px solid var(--ink); }
  .wordmark { font: italic 30px/1 var(--serif); letter-spacing: -.01em; }
  .wordmark b { font-style: normal; font-weight: 400; }
  .rb { font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); padding: 4px 8px; border: 1px solid var(--ink); }
  .right { margin-left: auto; display: flex; align-items: baseline; gap: 18px; font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
  .clock { color: var(--mute); font-variant-numeric: tabular-nums; }
  .status { display: inline-flex; align-items: center; gap: 8px; color: var(--ink2); }
  .status::before { content: ""; width: 9px; height: 9px; background: currentColor; }
  .status.running { color: var(--amber); } .status.running::before { animation: blink 1s steps(2) infinite; }
  .status.ok { color: var(--green); } .status.declined, .status.stopped, .status.failed { color: var(--red); }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes stamp { from { opacity: 0; transform: rotate(-12deg) scale(1.6); } 60% { opacity: .95; transform: rotate(-10deg) scale(.96); } to { opacity: .9; transform: rotate(-10deg) scale(1); } }
  main { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 0; max-width: 1240px; margin: 0 auto; padding: 0 36px 60px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; padding: 0 16px 40px; } .timeline { border-right: 0; border-bottom: 1px solid var(--rule); position: static; max-height: none; } }
  .k { font: 500 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin: 0; padding: 22px 0 12px; }
  .timeline { border-right: 1px solid var(--rule); padding-right: 28px; align-self: start; position: sticky; top: 0; max-height: 100vh; display: flex; flex-direction: column; }
  #steps { overflow-y: auto; scrollbar-width: thin; padding-bottom: 20px; }
  .step { display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 9px 0; border-top: 1px dotted var(--rule2); animation: rise .2s ease both; }
  .step:first-child { border-top: 0; }
  .step .t { font: 400 12px/1.6 var(--mono); color: var(--mute); font-variant-numeric: tabular-nums; }
  .step .name { font-weight: 500; font-size: 14px; }
  .step .name::before { content: "·"; margin-right: 7px; color: var(--mute); }
  .step.is-gate .name::before { content: "§"; color: var(--ink); } .step.done .name::before { content: "✓"; color: var(--green); } .step.bad .name::before { content: "!"; color: var(--red); } .step.final .name::before { content: "■"; }
  .step .detail { color: var(--mute); font: 12.5px/1.45 var(--mono); overflow-wrap: anywhere; }
  .form { padding-left: 32px; }
  .gate { position: relative; padding: 0 0 28px; animation: rise .25s ease both; }
  .gate + .gate { margin-top: 24px; border-top: 1px solid var(--rule); }
  .gate .k { display: flex; justify-content: space-between; }
  .gate .k span:last-child { color: var(--ink2); }
  .gate .title { font: 400 40px/1.05 var(--serif); letter-spacing: -.01em; margin: 0 0 12px; max-width: 760px; }
  .gate .lines { margin: 0 0 18px; color: var(--ink2); font-size: 14.5px; max-width: 720px; }
  .gate .lines div { padding: 1px 0; } .gate .lines div.src { font: 12.5px var(--mono); color: var(--mute); }
  .diff { border-top: 2px solid var(--ink); border-bottom: 1px solid var(--ink); }
  .diff .row { display: grid; grid-template-columns: 190px 28px minmax(0, 1fr); gap: 0 8px; padding: 10px 0; border-top: 1px solid var(--rule); }
  .diff .row:first-child { border-top: 0; }
  .diff .row .k { font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--mute); padding: 4px 0 0; margin: 0; }
  .diff .row .m { font: 500 15px var(--mono); padding-top: 1px; color: var(--mute); }
  .diff .row.changed .m { color: var(--green); }
  .diff .v input, .diff .v textarea { width: 100%; font: inherit; color: inherit; background: transparent; border: 0; border-bottom: 1px solid transparent; border-radius: 0; padding: 2px 0; transition: border-color .15s; }
  .diff .v input:hover, .diff .v textarea:hover { border-bottom-color: var(--rule2); }
  .diff .v input:focus, .diff .v textarea:focus { outline: none; border-bottom: 1px solid var(--ink); background: rgba(255,255,255,.5); }
  .was { display: block; color: var(--red); text-decoration: line-through; text-decoration-thickness: 1.5px; margin-bottom: 2px; font-size: 14.5px; }
  .items { counter-reset: it; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--ink); }
  .item { counter-increment: it; display: grid; grid-template-columns: 34px 22px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--rule); }
  .item:first-child { border-top: 0; }
  .item::before { content: counter(it, decimal-leading-zero); font: 500 12px var(--mono); color: var(--mute); }
  .item .box { width: 16px; height: 16px; border: 1.5px solid var(--ink); }
  .item .ttl { font-weight: 500; } .item .meta { color: var(--mute); font-size: 13px; }
  .item .due { font: 500 12px var(--mono); color: var(--ink2); }
  .actions { display: flex; gap: 12px; margin-top: 22px; align-items: center; }
  button { font: 600 14px var(--sans); letter-spacing: .02em; padding: 12px 22px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); cursor: pointer; border-radius: 0; box-shadow: 3px 3px 0 var(--ink); transition: transform .08s, box-shadow .08s; }
  button:hover { transform: translate(1px, 1px); box-shadow: 2px 2px 0 var(--ink); }
  button:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  button.ok { background: var(--ink); color: var(--paper); }
  button:disabled { opacity: .35; cursor: default; transform: none; box-shadow: 3px 3px 0 var(--ink); }
  .hint { color: var(--mute); font: 12.5px var(--mono); margin-left: auto; }
  kbd { font: 500 11.5px var(--mono); border: 1px solid var(--rule2); border-bottom-width: 2px; padding: 1px 6px; color: var(--ink2); background: rgba(255,255,255,.4); }
  .empty { padding: 90px 0; color: var(--mute); max-width: 520px; }
  .empty b { display: block; color: var(--ink); font: 400 34px/1.1 var(--serif); margin-bottom: 8px; }
  .stamp { position: absolute; right: 30px; top: 74px; font: 400 44px/1 var(--serif); text-transform: uppercase; letter-spacing: .12em; color: var(--red); padding: 10px 18px 8px; border: 3px double var(--red); mix-blend-mode: multiply; transform: rotate(-10deg); animation: stamp .35s cubic-bezier(.2,.9,.3,1.2) both; pointer-events: none; }
  .stamp.no { color: var(--ink2); border-color: var(--ink2); }
  .stamp small { display: block; font: 500 10px var(--mono); letter-spacing: .2em; text-align: center; margin-top: 4px; }
  .decided { margin-top: 16px; font: 14px var(--sans); color: var(--ink2); }
  .decided.yes { color: var(--green); } .decided.no { color: var(--red); }
  .past { opacity: .5; }
</style>
</head>
<body>
<header><div class="wordmark"><b>desk</b>hand</div><span class="rb" id="rb"></span><div class="right"><span class="clock" id="clock">0.0s</span><span class="status running" id="status">running</span></div></header>
<main>
  <section class="timeline"><h2 class="k">Run log</h2><div id="steps"></div></section>
  <section class="form" id="gates"><div class="gate"><div class="empty"><b>Reading the screen.</b>The first gate shows up here before anything is written.</div></div></section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const show = (v) => v == null || v === '' ? '' : Array.isArray(v) ? v.join(', ') : typeof v === 'object' ? JSON.stringify(v) : String(v);
  const ms = (t) => (t / 1000).toFixed(1) + 's';
  let state = {}, t0 = Date.now(), done = false, gateNo = 0;
  setInterval(() => { if (!done) $('clock').textContent = ms(Date.now() - t0); }, 100);
  function render() {
    $('rb').textContent = state.runbook || '';
    const st = $('status'); st.textContent = state.status; st.className = 'status ' + state.status;
  }
  const describe = (name, d) => {
    if (d.note) return d.note;
    switch (name) {
      case 'read-homepage': return d.h1 || d.title || d.url;
      case 'search': return `${d.query} → ${d.site}`;
      case 'fill': return `${d.label} ← ${d.key}`;
      case 'gate': return d.auto ? 'auto-approved (--yes)' : `${d.decision === 'yes' ? 'approved' : 'declined'}${d.via ? ' in the ' + d.via : ''}`;
      case 'saved': return d.verified ? 'verified on the page' : 'not verified, check the log';
      case 'found-existing': return `${d.existing?.name || ''} already in the CRM`;
      case 'drafted': return `${d.draft?.name || ''}${d.draft?.one_liner ? ' · ' + d.draft.one_liner : ''}`;
      case 'inbox': return `${d.rows} rows`;
      case 'picked': return `${d.open} of ${d.of} look like real asks`;
      case 'read': return d.subject ? `${d.subject} · ${d.asks} ask${d.asks === 1 ? '' : 's'}` : d.company ? `${d.company}: ${d.value}` : '';
      case 'task': return d.task;
      case 'submitted': return `page ${d.page}${d.missing?.length ? ' · missing ' + d.missing.join(', ') : ''}`;
      case 'tracker': return Object.values(d.row || {}).join(' · ');
      case 'winner': return `${d.head} (${d.why})`;
      case 'failed': return `${d.company || ''} ${d.error || ''}`;
      case 'extracted': return d.empty?.length ? `missing: ${d.empty.join(', ')}` : 'all fields found';
      default: return Object.entries(d).map(([k, v]) => `${k}: ${show(v)}`).join(' · ');
    }
  };
  function addStep(ev) {
    const d = ev.data || {};
    const detail = String(describe(ev.name, d) || '').slice(0, 110);
    const el = document.createElement('div');
    el.className = 'step' + (ev.name === 'gate' ? ' is-gate' : '') + (['saved', 'task', 'submitted', 'tracker'].includes(ev.name) ? ' done' : '') + (['failed', 'field-missing', 'row-gone'].includes(ev.name) ? ' bad' : '') + (ev.name.startsWith('finish') ? ' final' : '');
    el.innerHTML = `<span class="t">${ms(ev.t)}</span><div><div class="name">${esc(ev.name.replace(/-/g, ' '))}</div>${detail ? `<div class="detail">${esc(detail)}</div>` : ''}</div>`;
    $('steps').appendChild(el); $('steps').scrollTop = $('steps').scrollHeight;
  }
  function addGate(g) {
    const host = $('gates');
    if (host.querySelector('.empty')) host.innerHTML = '';
    for (const p of host.querySelectorAll('.gate')) p.classList.add('past');
    gateNo += 1;
    const keys = [...new Set([...Object.keys(g.before || {}), ...Object.keys(g.after || {})])];
    const rows = keys.map((k) => {
      const a = g.before ? show(g.before[k]) : null, b = show(g.after?.[k]);
      const changed = g.before && a !== b;
      const long = b.length > 60;
      const input = g.allowEdit === false ? `<span>${esc(b)}</span>`
        : long ? `<textarea data-k="${esc(k)}" rows="2">${esc(b)}</textarea>` : `<input data-k="${esc(k)}" value="${esc(b)}">`;
      return `<div class="row ${changed ? 'changed' : ''}"><div class="k">${esc(k)}</div><div class="m">${changed ? '+' : ''}</div><div class="v">${changed ? `<span class="was">${esc(a) || '(empty)'}</span>` : ''}${input}</div></div>`;
    }).join('');
    const card = document.createElement('div');
    card.className = 'gate'; card.id = g.id;
    card.innerHTML = `<h2 class="k"><span>Gate № ${String(gateNo).padStart(2, '0')}</span><span>${esc(state.runbook || '')}</span></h2><div class="title">${esc(g.title)}</div>
      <div class="lines">${(g.lines || []).map((l) => `<div class="${/^(Source|Why|Will)/.test(l) ? 'src' : ''}">${esc(l)}</div>`).join('')}</div>
      ${keys.length ? `<div class="diff">${rows}</div>` : ''}
      ${g.items?.length ? `<div class="items">${g.items.map((it) => `<div class="item"><span class="box"></span><div><div class="ttl">${esc(it.title)}</div><div class="meta">${esc(it.meta || '')}</div></div>${it.due ? `<span class="due">due ${esc(it.due)}</span>` : '<span></span>'}</div>`).join('')}</div>` : ''}
      <div class="actions"><button class="ok">Approve</button><button class="no">Decline</button><span class="hint">${keys.length && g.allowEdit !== false ? 'click a value to edit · ' : ''}terminal <kbd>y</kbd> <kbd>n</kbd></span></div>`;
    host.prepend(card); window.scrollTo({ top: 0 });
    const answer = async (decision) => {
      const record = g.after ? { ...g.after } : null;
      if (record) for (const el of card.querySelectorAll('[data-k]')) record[el.dataset.k] = el.value;
      for (const b of card.querySelectorAll('button')) b.disabled = true;
      await fetch('/answer', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: g.id, decision, record }) });
    };
    card.querySelector('.ok').onclick = () => answer('yes');
    card.querySelector('.no').onclick = () => answer('no');
  }
  function gateDone(ev) {
    const card = $(ev.id); if (!card) return;
    for (const b of card.querySelectorAll('button')) b.disabled = true;
    for (const el of card.querySelectorAll('[data-k]')) el.disabled = true;
    const now = new Date();
    const s = document.createElement('div'); s.className = 'stamp ' + (ev.decision === 'yes' ? 'yes' : 'no');
    s.innerHTML = `${ev.decision === 'yes' ? 'Approved' : 'Declined'}<small>${now.toISOString().slice(0, 10)} · ${now.toTimeString().slice(0, 5)}</small>`;
    card.appendChild(s);
    const d = document.createElement('div'); d.className = 'decided ' + ev.decision; d.textContent = ev.decision === 'yes' ? 'Approved. Writing it now.' : 'Declined. Nothing was written.';
    card.querySelector('.actions').after(d);
  }
  function handle(ev) {
    if (ev.type === 'hello') { state = ev.state; t0 = Date.now() - (ev.events.at(-1)?.t || 0); render(); ev.events.forEach(handle); return; }
    if (ev.type === 'step') addStep(ev);
    if (ev.type === 'gate') addGate(ev.gate);
    if (ev.type === 'gate-done') gateDone(ev);
    if (ev.type === 'finish') { state.status = ev.status; done = true; $('clock').textContent = ms(ev.t); render(); addStep({ name: 'finish · ' + ev.status, t: ev.t, data: ev.data }); for (const d of document.querySelectorAll('.decided.yes')) d.textContent = ev.status === 'ok' ? 'Approved and written.' : `Approved. Run ended: ${ev.status}.`; }
  }
  new EventSource('/events').onmessage = (m) => handle(JSON.parse(m.data));
</script>
</body>
</html>
