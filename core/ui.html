<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deskhand</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --win: #ffffff; --side: #f3f3f5; --bar: #f7f7f8; --line: #dcdce0; --line2: #ebebee; --ink: #1d1d1f; --ink2: #515154; --mute: #86868b;
    --blue: #0a66ff; --blue-ink: #ffffff; --green: #1a7f37; --green-bg: #e6f6ea; --red: #c62828; --red-bg: #fdecec; --sel: #e4ecfb;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Helvetica, Arial, sans-serif; --mono: ui-monospace, "SF Mono", Menlo, "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--win); color: var(--ink); font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; display: grid; grid-template-rows: 38px 1fr 24px; }
  .titlebar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; background: var(--bar); border-bottom: 1px solid var(--line); padding: 0 12px; -webkit-app-region: drag; }
  .lights { display: flex; gap: 8px; } .lights i { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,.12); } .lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
  .title { font-weight: 500; color: var(--ink2); font-size: 13px; text-align: center; } .title span { color: var(--mute); font-weight: 400; }
  .tb-right { justify-self: end; display: flex; gap: 6px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #fff; }
  .seg span { padding: 3px 10px; font-size: 12px; color: var(--ink2); border-right: 1px solid var(--line); } .seg span:last-child { border-right: 0; } .seg span.on { background: var(--line2); color: var(--ink); font-weight: 500; }
  .body { display: grid; grid-template-columns: 208px minmax(0, 1fr) 300px; min-height: 0; }
  @media (max-width: 900px) { .body { grid-template-columns: 1fr; } .side, .inspector { display: none; } }
  .side { background: var(--side); border-right: 1px solid var(--line); padding: 10px 8px; overflow-y: auto; }
  .side h3 { font-size: 11px; font-weight: 600; color: var(--mute); text-transform: uppercase; letter-spacing: .02em; margin: 8px 8px 4px; }
  .side a { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side a svg { width: 14px; height: 14px; flex: none; stroke: var(--ink2); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .side a.on { background: var(--blue); color: var(--blue-ink); } .side a.on svg { stroke: #fff; }
  .side a .st { margin-left: auto; font-size: 11px; color: var(--mute); font-family: var(--mono); } .side a.on .st { color: rgba(255,255,255,.8); }
  .side a .ok { color: var(--green); } .side a .bad { color: var(--red); }
  .main { display: flex; flex-direction: column; min-width: 0; }
  .crumbs { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-bottom: 1px solid var(--line2); font-size: 12px; color: var(--mute); }
  .crumbs b { color: var(--ink); font-weight: 500; } .crumbs .sep { color: var(--line); }
  .crumbs .pill { margin-left: auto; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 10px; background: var(--line2); color: var(--ink2); }
  .crumbs .pill.running { background: #fff4d6; color: #8a5a00; } .crumbs .pill.ok { background: var(--green-bg); color: var(--green); } .crumbs .pill.declined, .crumbs .pill.stopped, .crumbs .pill.failed { background: var(--red-bg); color: var(--red); }
  .content { overflow-y: auto; padding: 18px 20px 24px; }
  .gate { max-width: 820px; }
  .gate + .gate { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line2); opacity: .6; }
  .gate h1 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; margin: 0 0 4px; }
  .gate .sub { color: var(--ink2); font-size: 13px; margin: 0 0 12px; } .gate .sub .src { font-family: var(--mono); font-size: 11.5px; color: var(--mute); }
  .gate .sub div { padding: 1px 0; }
  .diff { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; font: 12.5px/1.6 var(--mono); margin: 0 0 12px; }
  .diff .hd { background: var(--bar); border-bottom: 1px solid var(--line); padding: 5px 10px; font: 11.5px var(--sans); color: var(--mute); display: flex; gap: 10px; }
  .diff .hd b { color: var(--ink2); font-weight: 500; } .diff .hd .add { color: var(--green); } .diff .hd .del { color: var(--red); }
  .diff .ln { display: grid; grid-template-columns: 38px 16px 1fr; align-items: baseline; min-height: 22px; }
  .diff .ln .n { text-align: right; padding-right: 8px; color: var(--mute); font-size: 11px; user-select: none; }
  .diff .ln .s { color: var(--mute); }
  .diff .ln .c { padding-right: 10px; white-space: pre-wrap; overflow-wrap: anywhere; display: flex; align-items: baseline; }
  .diff .ln .c .k { flex: none; }
  .diff .ln .c .k { color: var(--ink2); } .diff .ln .c .k::after { content: ": "; }
  .diff .ln.del { background: var(--red-bg); } .diff .ln.del .s, .diff .ln.del .n { color: var(--red); }
  .diff .ln.add { background: var(--green-bg); } .diff .ln.add .s, .diff .ln.add .n { color: var(--green); }
  .diff .ln .c input { flex: 1; min-width: 0; font: inherit; color: inherit; background: transparent; border: 0; border-bottom: 1px dashed transparent; padding: 0; }
  .diff .ln .c input:hover { border-bottom-color: var(--mute); } .diff .ln .c input:focus { outline: none; border-bottom: 1px solid var(--blue); background: #fff; }
  .list { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 12px; }
  .list .row { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 7px 10px; border-top: 1px solid var(--line2); }
  .list .row:first-child { border-top: 0; }
  .list .row:nth-child(even) { background: var(--bar); }
  .list .box { width: 14px; height: 14px; border: 1px solid var(--mute); border-radius: 3px; background: #fff; }
  .list .ttl { font-weight: 500; } .list .meta { color: var(--mute); font-size: 12px; } .list .due { font: 11.5px var(--mono); color: var(--ink2); }
  .foot { display: flex; align-items: center; gap: 8px; padding-top: 4px; }
  .foot .note { color: var(--mute); font-size: 12px; }
  .foot .sp { flex: 1; }
  button { font: 500 13px var(--sans); padding: 5px 14px; border-radius: 6px; border: 1px solid var(--line); background: linear-gradient(#fff, #f4f4f6); color: var(--ink); cursor: pointer; box-shadow: 0 1px 1px rgba(0,0,0,.05); display: inline-flex; align-items: center; gap: 8px; }
  button kbd { font: 11px var(--sans); color: var(--mute); }
  button.ok { background: linear-gradient(#2f7bff, var(--blue)); border-color: #0a5be0; color: #fff; } button.ok kbd { color: rgba(255,255,255,.75); }
  button:active { filter: brightness(.95); }
  button:disabled { opacity: .5; cursor: default; }
  .decided { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12.5px; color: var(--ink2); }
  .decided i { width: 14px; height: 14px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10px; color: #fff; font-style: normal; }
  .decided.yes i { background: var(--green); } .decided.no i { background: var(--red); }
  .empty { color: var(--mute); padding: 40px 0; font-size: 13px; } .empty b { display: block; color: var(--ink); font-weight: 600; margin-bottom: 3px; }
  .inspector { border-left: 1px solid var(--line); background: var(--win); display: flex; flex-direction: column; min-height: 0; }
  .inspector h3 { font-size: 11px; font-weight: 600; color: var(--mute); text-transform: uppercase; margin: 0; padding: 10px 12px 6px; border-bottom: 1px solid var(--line2); }
  #steps { overflow-y: auto; padding: 4px 0; }
  .step { display: grid; grid-template-columns: 44px 1fr; gap: 6px; padding: 5px 12px; font-size: 12px; }
  .step:hover { background: var(--bar); }
  .step .t { font: 11px/1.7 var(--mono); color: var(--mute); }
  .step .name { font-weight: 500; } .step .name::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--mute); margin: 0 6px 1px 0; }
  .step.is-gate .name::before { background: var(--blue); } .step.done .name::before { background: var(--green); } .step.bad .name::before { background: var(--red); }
  .step .detail { color: var(--mute); font: 11px/1.45 var(--mono); overflow-wrap: anywhere; }
  .statusbar { display: flex; align-items: center; gap: 18px; padding: 0 12px; background: var(--bar); border-top: 1px solid var(--line); font: 11px var(--sans); color: var(--mute); white-space: nowrap; overflow: hidden; }
  .statusbar span { display: inline-flex; align-items: center; gap: 5px; } .statusbar .mono { font-family: var(--mono); }
  .statusbar .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
  .statusbar .r { margin-left: auto; }
</style>
</head>
<body>
<div class="titlebar"><div class="lights"><i></i><i></i><i></i></div><div class="title">deskhand <span id="ttl"></span></div><div class="tb-right"><div class="seg"><span class="on">Gate</span><span>Log</span><span>Snapshot</span></div></div></div>
<div class="body">
  <nav class="side">
    <h3>Runbooks</h3><div id="rbs"></div>
    <h3>Recent runs</h3><div id="runs"></div>
  </nav>
  <section class="main">
    <div class="crumbs"><b id="rb"></b><span class="sep">›</span><span id="where">starting</span><span class="pill running" id="status">running</span></div>
    <div class="content" id="gates"><div class="gate"><div class="empty"><b>Reading the screen</b>The first gate appears here before anything is written.</div></div></div>
  </section>
  <aside class="inspector"><h3>Run log</h3><div id="steps"></div></aside>
</div>
<div class="statusbar"><span><i class="dot"></i>Chrome · <span class="mono" id="profile"></span></span><span><span class="mono" id="model"></span> · <span id="calls">0 calls</span></span><span class="r">log <span class="mono" id="logp"></span></span><span class="mono" id="clock">0.0s</span></div>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const show = (v) => v == null || v === '' ? '' : Array.isArray(v) ? v.join(', ') : typeof v === 'object' ? JSON.stringify(v) : String(v);
  const ms = (t) => (t / 1000).toFixed(1) + 's';
  const RUNBOOKS = { 'lead-to-crm': 'M4 12h16M14 6l6 6-6 6', 'inbox-triage': 'M3 7l9 6 9-6M3 6h18v12H3z', 'onboarding-fill': 'M6 3h9l4 4v14H6zM9 12h6M9 16h6', 'portfolio-digest': 'M4 20V10M10 20V4M16 20v-7M22 20H2', 'lineup-to-site': 'M4 20h16M12 4l8 8-8 8M4 12h16' };
  let state = {}, t0 = Date.now(), done = false, gateNo = 0;
  setInterval(() => { if (!done) $('clock').textContent = ms(Date.now() - t0); }, 100);
  function render() {
    $('rb').textContent = state.runbook || ''; $('ttl').textContent = state.runbook ? '— ' + state.runbook : '';
    const st = $('status'); st.textContent = state.status; st.className = 'pill ' + state.status;
    const i = state.info || {};
    $('profile').textContent = i.profile || ''; $('model').textContent = i.model || ''; $('logp').textContent = i.log || '';
    $('rbs').innerHTML = Object.entries(RUNBOOKS).map(([n, d]) => `<a class="${n === state.runbook ? 'on' : ''}"><svg viewBox="0 0 24 24"><path d="${d}"/></svg>${n}</a>`).join('');
    $('runs').innerHTML = (i.runs || []).map((r) => `<a title="${esc(r.file)}">${esc(r.runbook)}<span class="st ${r.status === 'ok' ? 'ok' : r.status === 'running' ? '' : 'bad'}">${esc(r.at.slice(5, 16))}</span></a>`).join('') || '<a style="color:var(--mute)">none yet</a>';
  }
  const describe = (name, d) => {
    if (d.note) return d.note;
    switch (name) {
      case 'read-homepage': return d.h1 || d.title || d.url;
      case 'search': return `${d.query} → ${d.site}`;
      case 'fill': return `${d.label} ← ${d.key}`;
      case 'gate': return d.auto ? 'auto-approved (--yes)' : `${d.decision === 'yes' ? 'approved' : 'declined'}${d.via ? ' in the ' + d.via : ''}`;
      case 'saved': return d.verified ? 'verified on the page' : 'not verified, check the log';
      case 'found-existing': return `${d.existing?.name || ''} already in the CRM`;
      case 'drafted': return `${d.draft?.name || ''}${d.draft?.one_liner ? ' · ' + d.draft.one_liner : ''}`;
      case 'inbox': return `${d.rows} rows`;
      case 'picked': return `${d.open} of ${d.of} look like real asks`;
      case 'read': return d.subject ? `${d.subject} · ${d.asks} ask${d.asks === 1 ? '' : 's'}` : d.company ? `${d.company}: ${d.value}` : '';
      case 'task': return d.task;
      case 'submitted': return `page ${d.page}${d.missing?.length ? ' · missing ' + d.missing.join(', ') : ''}`;
      case 'tracker': return Object.values(d.row || {}).join(' · ');
      case 'winner': return `${d.head} (${d.why})`;
      case 'failed': return `${d.company || ''} ${d.error || ''}`;
      case 'extracted': return d.empty?.length ? `missing: ${d.empty.join(', ')}` : 'all fields found';
      default: return Object.entries(d).map(([k, v]) => `${k}: ${show(v)}`).join(' · ');
    }
  };
  function addStep(ev) {
    const d = ev.data || {};
    const detail = String(describe(ev.name, d) || '').slice(0, 110);
    const el = document.createElement('div');
    el.className = 'step' + (ev.name === 'gate' ? ' is-gate' : '') + (['saved', 'task', 'submitted', 'tracker'].includes(ev.name) ? ' done' : '') + (['failed', 'field-missing', 'row-gone'].includes(ev.name) ? ' bad' : '');
    el.innerHTML = `<span class="t">${ms(ev.t)}</span><div><div class="name">${esc(ev.name.replace(/-/g, ' '))}</div>${detail ? `<div class="detail">${esc(detail)}</div>` : ''}</div>`;
    $('steps').appendChild(el); $('steps').scrollTop = $('steps').scrollHeight;
    if (ev.calls != null) $('calls').textContent = `${ev.calls} call${ev.calls === 1 ? '' : 's'}`;
    $('where').textContent = ev.name.replace(/-/g, ' ');
  }
  function addGate(g) {
    const host = $('gates');
    if (host.querySelector('.empty')) host.innerHTML = '';
    gateNo += 1; $('where').textContent = `gate ${gateNo}`;
    const keys = [...new Set([...Object.keys(g.before || {}), ...Object.keys(g.after || {})])];
    let n = 0, adds = 0, dels = 0;
    const lines = keys.map((k) => {
      const a = g.before ? show(g.before[k]) : null, b = show(g.after?.[k]);
      const changed = g.before ? a !== b : true;
      const edit = g.allowEdit === false ? esc(b) : `<input data-k="${esc(k)}" value="${esc(b)}">`;
      let out = '';
      if (changed && g.before && a !== '') { dels++; out += `<div class="ln del"><span class="n">${++n}</span><span class="s">−</span><span class="c"><span class="k">${esc(k)}</span>${esc(a)}</span></div>`; }
      if (changed) { adds++; out += `<div class="ln add"><span class="n">${++n}</span><span class="s">+</span><span class="c"><span class="k">${esc(k)}</span>${edit}</span></div>`; }
      else out += `<div class="ln ctx"><span class="n">${++n}</span><span class="s"></span><span class="c"><span class="k">${esc(k)}</span>${edit}</span></div>`;
      return out;
    }).join('');
    const card = document.createElement('div');
    card.className = 'gate'; card.id = g.id;
    card.innerHTML = `<h1>${esc(g.title)}</h1>
      <div class="sub">${(g.lines || []).map((l) => `<div class="${/^(Source|Why|Will)/.test(l) ? 'src' : ''}">${esc(l)}</div>`).join('')}</div>
      ${keys.length ? `<div class="diff"><div class="hd"><b>${g.before ? 'record' : 'new record'}</b><span class="add">+${adds}</span>${dels ? `<span class="del">−${dels}</span>` : ''}<span style="margin-left:auto">${g.allowEdit === false ? '' : 'click a + line to edit'}</span></div>${lines}</div>` : ''}
      ${g.items?.length ? `<div class="list">${g.items.map((it) => `<div class="row"><span class="box"></span><div><div class="ttl">${esc(it.title)}</div><div class="meta">${esc(it.meta || '')}</div></div>${it.due ? `<span class="due">${esc(it.due)}</span>` : '<span></span>'}</div>`).join('')}</div>` : ''}
      <div class="foot"><span class="note">Nothing is written until you approve.</span><span class="sp"></span><button class="no">Decline <kbd>esc</kbd></button><button class="ok">Approve <kbd>⌘↩</kbd></button></div>`;
    host.prepend(card); host.scrollTop = 0;
    const answer = async (decision) => {
      const record = g.after ? { ...g.after } : null;
      if (record) for (const el of card.querySelectorAll('[data-k]')) record[el.dataset.k] = el.value;
      for (const b of card.querySelectorAll('button')) b.disabled = true;
      await fetch('/answer', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: g.id, decision, record }) });
    };
    card.querySelector('.ok').onclick = () => answer('yes');
    card.querySelector('.no').onclick = () => answer('no');
    const key = (e) => { if (card.querySelector('.ok').disabled) return; if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') answer('yes'); if (e.key === 'Escape') answer('no'); };
    window.addEventListener('keydown', key);
  }
  function gateDone(ev) {
    const card = $(ev.id); if (!card) return;
    for (const b of card.querySelectorAll('button')) b.disabled = true;
    for (const el of card.querySelectorAll('[data-k]')) el.disabled = true;
    const d = document.createElement('div'); d.className = 'decided ' + ev.decision;
    d.innerHTML = `<i>${ev.decision === 'yes' ? '✓' : '✕'}</i>${ev.decision === 'yes' ? 'Approved' : 'Declined'} at ${new Date().toTimeString().slice(0, 8)} · ${ev.decision === 'yes' ? 'writing now' : 'nothing written'}`;
    card.querySelector('.foot').after(d);
  }
  function handle(ev) {
    if (ev.type === 'hello') { state = ev.state; t0 = Date.now() - (ev.events.at(-1)?.t || 0); render(); ev.events.forEach(handle); return; }
    if (ev.type === 'step') addStep(ev);
    if (ev.type === 'gate') addGate(ev.gate);
    if (ev.type === 'gate-done') gateDone(ev);
    if (ev.type === 'finish') { state.status = ev.status; done = true; $('clock').textContent = ms(ev.t); render(); addStep({ name: 'finish · ' + ev.status, t: ev.t, data: ev.data }); $('where').textContent = 'finished'; for (const d of document.querySelectorAll('.decided.yes')) d.lastChild.textContent = d.lastChild.textContent.replace('writing now', ev.status === 'ok' ? 'written and verified' : 'run ended: ' + ev.status); }
  }
  new EventSource('/events').onmessage = (m) => handle(JSON.parse(m.data));
</script>
</body>
</html>
