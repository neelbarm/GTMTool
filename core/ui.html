<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deskhand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0b0f; --bg2: #0f1117; --panel: rgba(255,255,255,.035); --panel2: rgba(255,255,255,.06); --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.14);
    --ink: #f2f3f7; --ink2: #b7bbc8; --mute: #7d8292; --accent: #7c8cff; --accent2: #b37cff; --glow: rgba(124,140,255,.45);
    --ok: #4ade80; --ok-bg: rgba(74,222,128,.12); --no: #fb7185; --no-bg: rgba(251,113,133,.12); --amber: #fbbf24; --amber-bg: rgba(251,191,36,.12);
    --display: "Inter Tight", "Inter", -apple-system, BlinkMacSystemFont, sans-serif; --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; min-height: 100vh; color: var(--ink); font: 15px/1.5 var(--sans); background:
    radial-gradient(900px 500px at 8% -10%, rgba(124,140,255,.22), transparent 60%),
    radial-gradient(800px 500px at 100% 0%, rgba(179,124,255,.16), transparent 55%),
    linear-gradient(var(--bg2), var(--bg)); background-attachment: fixed; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 40px 40px; mask-image: radial-gradient(ellipse at 30% 0%, #000 10%, transparent 70%); }
  header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 14px; padding: 14px 28px; border-bottom: 1px solid var(--line); background: rgba(10,11,15,.7); backdrop-filter: blur(14px); }
  .wordmark { display: flex; align-items: center; gap: 10px; font: 600 17px/1 var(--display); letter-spacing: -.02em; }
  .wordmark i { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 0 18px var(--glow); }
  .rb { font: 500 12.5px var(--mono); color: var(--ink2); padding: 5px 10px; border: 1px solid var(--line2); border-radius: 999px; background: var(--panel); }
  .right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
  .clock { font: 500 12.5px var(--mono); color: var(--mute); }
  .status { font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; padding: 7px 11px; border-radius: 999px; display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line2); color: var(--ink2); }
  .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .status.running { color: var(--amber); background: var(--amber-bg); border-color: rgba(251,191,36,.3); } .status.running::before { animation: pulse 1.1s infinite; box-shadow: 0 0 10px currentColor; }
  .status.ok { color: var(--ok); background: var(--ok-bg); border-color: rgba(74,222,128,.3); }
  .status.declined, .status.stopped, .status.failed { color: var(--no); background: var(--no-bg); border-color: rgba(251,113,133,.3); }
  @keyframes pulse { 50% { opacity: .25; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  main { position: relative; display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 24px; padding: 28px; max-width: 1240px; margin: 0 auto; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; padding: 16px; } .timeline { position: static; max-height: none; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; backdrop-filter: blur(10px); }
  h2.k { font: 600 11px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); margin: 0; padding: 16px 20px 10px; }
  .timeline { align-self: start; position: sticky; top: 84px; max-height: calc(100vh - 112px); display: flex; flex-direction: column; }
  #steps { overflow-y: auto; padding: 4px 0 10px; scrollbar-width: thin; }
  .step { position: relative; display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; padding: 9px 20px; animation: rise .25s ease both; }
  .step::before { content: ""; position: absolute; left: 29px; top: 0; bottom: 0; width: 1px; background: var(--line); }
  .step:first-child::before { top: 18px; } .step:last-child::before { bottom: calc(100% - 18px); }
  .step .dot { position: relative; z-index: 1; width: 9px; height: 9px; margin: 8px 0 0 5px; border-radius: 50%; background: var(--mute); box-shadow: 0 0 0 3px var(--bg2); }
  .step.is-gate .dot { background: var(--accent); box-shadow: 0 0 0 3px var(--bg2), 0 0 12px var(--glow); }
  .step.done .dot { background: var(--ok); } .step.bad .dot { background: var(--no); }
  .step:last-child .dot { animation: pulse 1.1s infinite; }
  .step.final .dot { animation: none; background: var(--ok); }
  .step .name { font-weight: 500; font-size: 14px; letter-spacing: -.005em; }
  .step .detail { color: var(--mute); font: 12.5px/1.45 var(--mono); overflow-wrap: anywhere; margin-top: 1px; }
  .step .t { color: var(--mute); font: 12px var(--mono); padding-top: 3px; }
  .gate { position: relative; padding: 0 0 22px; overflow: hidden; animation: rise .3s ease both; }
  .gate::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: linear-gradient(90deg, var(--accent), var(--accent2), transparent); }
  .gate .title { font: 600 26px/1.15 var(--display); letter-spacing: -.025em; margin: 6px 22px 10px; }
  .gate .lines { margin: 0 22px 14px; color: var(--ink2); font-size: 14px; } .gate .lines div { padding: 2px 0; } .gate .lines div.src { font-family: var(--mono); font-size: 12.5px; color: var(--mute); }
  table.diff { width: calc(100% - 44px); margin: 4px 22px; border-collapse: collapse; font-size: 14.5px; }
  table.diff td { padding: 10px 10px; border-top: 1px solid var(--line); vertical-align: top; }
  table.diff tr:first-child td { border-top: 0; }
  table.diff td.k { width: 160px; color: var(--mute); font: 500 12.5px var(--mono); padding-top: 13px; }
  table.diff td.v input, table.diff td.v textarea { width: 100%; font: inherit; color: var(--ink); background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 5px 8px; margin: -5px -8px; transition: border-color .15s, background .15s; }
  table.diff td.v input:hover, table.diff td.v textarea:hover { border-color: var(--line2); background: var(--panel2); }
  table.diff td.v input:focus, table.diff td.v textarea:focus { outline: none; border-color: var(--accent); background: var(--panel2); box-shadow: 0 0 0 3px rgba(124,140,255,.18); }
  table.diff td.v input:disabled, table.diff td.v textarea:disabled { color: var(--ink2); }
  .was { display: inline-block; font-size: 13px; color: var(--no); background: var(--no-bg); text-decoration: line-through; padding: 2px 8px; border-radius: 6px; margin: 0 0 6px -8px; }
  .now { display: inline-block; background: var(--ok-bg); color: var(--ok); padding: 3px 8px; border-radius: 6px; margin-left: -8px; }
  .items { margin: 6px 22px 0; display: grid; gap: 8px; }
  .item { display: grid; grid-template-columns: 24px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
  .item .box { width: 18px; height: 18px; border-radius: 6px; border: 1.5px solid var(--line2); background: var(--panel2); }
  .item .ttl { font-weight: 500; letter-spacing: -.005em; } .item .meta { color: var(--mute); font-size: 13px; }
  .item .due { font: 500 12px var(--mono); padding: 4px 9px; border-radius: 999px; background: var(--panel2); color: var(--ink2); border: 1px solid var(--line2); }
  .actions { display: flex; gap: 10px; margin: 20px 22px 0; align-items: center; }
  button { font: 600 14.5px var(--sans); border-radius: 11px; padding: 11px 20px; border: 1px solid var(--line2); background: var(--panel2); color: var(--ink); cursor: pointer; transition: transform .1s, box-shadow .15s, background .15s; }
  button:hover { transform: translateY(-1px); }
  button.ok { background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: transparent; color: #fff; box-shadow: 0 8px 28px -8px var(--glow), inset 0 1px 0 rgba(255,255,255,.25); }
  button.ok:hover { box-shadow: 0 10px 34px -8px var(--glow), inset 0 1px 0 rgba(255,255,255,.25); }
  button.no:hover { color: var(--no); border-color: rgba(251,113,133,.4); }
  button:disabled { opacity: .45; cursor: default; transform: none; box-shadow: none; }
  .hint { color: var(--mute); font-size: 13px; margin-left: auto; }
  kbd { font: 500 11.5px var(--mono); border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; color: var(--ink2); }
  .empty { padding: 56px 22px; color: var(--mute); text-align: center; font-size: 14px; }
  .empty b { display: block; color: var(--ink2); font: 600 18px var(--display); letter-spacing: -.02em; margin-bottom: 6px; }
  .decided { margin: 14px 22px 0; padding: 12px 16px; border-radius: 12px; font-weight: 500; display: flex; gap: 10px; align-items: center; animation: rise .25s ease both; }
  .decided.yes { background: var(--ok-bg); color: var(--ok); border: 1px solid rgba(74,222,128,.25); } .decided.no { background: var(--no-bg); color: var(--no); border: 1px solid rgba(251,113,133,.25); }
  .past { opacity: .55; margin-top: 16px; } .past::before { opacity: .4; }
</style>
</head>
<body>
<header><div class="wordmark"><i></i>deskhand</div><span class="rb" id="rb"></span><div class="right"><span class="clock" id="clock">0.0s</span><span class="status running" id="status">running</span></div></header>
<main>
  <section class="card timeline"><h2 class="k">Run</h2><div id="steps"></div></section>
  <section id="gates"><div class="card gate"><div class="empty"><b>Reading the screen</b>The first gate shows up here before anything is written.</div></div></section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const show = (v) => v == null || v === '' ? '' : Array.isArray(v) ? v.join(', ') : typeof v === 'object' ? JSON.stringify(v) : String(v);
  const ms = (t) => (t / 1000).toFixed(1) + 's';
  let state = {}, t0 = Date.now(), lastT = 0, done = false;
  setInterval(() => { if (!done) $('clock').textContent = ms(Date.now() - t0); }, 100);
  function render() {
    $('rb').textContent = state.runbook || '';
    const st = $('status'); st.textContent = state.status; st.className = 'status ' + state.status;
  }
  const describe = (name, d) => {
    if (d.note) return d.note;
    switch (name) {
      case 'read-homepage': return d.h1 || d.title || d.url;
      case 'search': return `${d.query} → ${d.site}`;
      case 'fill': return `${d.label} ← ${d.key}`;
      case 'gate': return d.auto ? 'auto-approved (--yes)' : `${d.decision === 'yes' ? 'approved' : 'declined'}${d.via ? ' in the ' + d.via : ''}`;
      case 'saved': return d.verified ? 'verified on the page' : 'not verified, check the log';
      case 'found-existing': return `${d.existing?.name || ''} already in the CRM`;
      case 'drafted': return `${d.draft?.name || ''}${d.draft?.one_liner ? ' · ' + d.draft.one_liner : ''}`;
      case 'inbox': return `${d.rows} rows`;
      case 'picked': return `${d.open} of ${d.of} look like real asks`;
      case 'read': return d.subject ? `${d.subject} · ${d.asks} ask${d.asks === 1 ? '' : 's'}` : d.company ? `${d.company}: ${d.value}` : '';
      case 'task': return d.task;
      case 'submitted': return `page ${d.page}${d.missing?.length ? ' · missing ' + d.missing.join(', ') : ''}`;
      case 'tracker': return Object.values(d.row || {}).join(' · ');
      case 'winner': return `${d.head} (${d.why})`;
      case 'failed': return `${d.company || ''} ${d.error || ''}`;
      case 'extracted': return d.empty?.length ? `missing: ${d.empty.join(', ')}` : 'all fields found';
      default: return Object.entries(d).map(([k, v]) => `${k}: ${show(v)}`).join(' · ');
    }
  };
  function addStep(ev) {
    const d = ev.data || {};
    const detail = String(describe(ev.name, d) || '').slice(0, 110);
    const el = document.createElement('div');
    el.className = 'step' + (ev.name === 'gate' ? ' is-gate' : '') + (['saved', 'task', 'submitted', 'tracker'].includes(ev.name) ? ' done' : '') + (['failed', 'field-missing', 'row-gone'].includes(ev.name) ? ' bad' : '') + (ev.name.startsWith('finish') ? ' final' : '');
    el.innerHTML = `<span class="dot"></span><div><div class="name">${esc(ev.name.replace(/-/g, ' '))}</div>${detail ? `<div class="detail">${esc(detail)}</div>` : ''}</div><span class="t">${ms(ev.t)}</span>`;
    $('steps').appendChild(el); $('steps').scrollTop = $('steps').scrollHeight;
  }
  function addGate(g) {
    const host = $('gates');
    if (host.querySelector('.empty')) host.innerHTML = '';
    for (const p of host.querySelectorAll('.gate')) p.classList.add('past');
    const keys = [...new Set([...Object.keys(g.before || {}), ...Object.keys(g.after || {})])];
    const rows = keys.map((k) => {
      const a = g.before ? show(g.before[k]) : null, b = show(g.after?.[k]);
      const changed = g.before && a !== b;
      const long = b.length > 60;
      const input = g.allowEdit === false ? `<span class="${changed || !g.before ? 'now' : ''}">${esc(b)}</span>`
        : long ? `<textarea data-k="${esc(k)}" rows="2">${esc(b)}</textarea>` : `<input data-k="${esc(k)}" value="${esc(b)}">`;
      return `<tr><td class="k">${esc(k)}</td><td class="v">${changed ? `<span class="was">${esc(a) || 'empty'}</span><br>` : ''}${input}</td></tr>`;
    }).join('');
    const card = document.createElement('div');
    card.className = 'card gate'; card.id = g.id;
    card.innerHTML = `<h2 class="k">Gate</h2><div class="title">${esc(g.title)}</div>
      <div class="lines">${(g.lines || []).map((l) => `<div class="${/^(Source|Why|Will|Source:)/.test(l) ? 'src' : ''}">${esc(l)}</div>`).join('')}</div>
      ${keys.length ? `<table class="diff">${rows}</table>` : ''}
      ${g.items?.length ? `<div class="items">${g.items.map((it) => `<div class="item"><span class="box"></span><div><div class="ttl">${esc(it.title)}</div><div class="meta">${esc(it.meta || '')}</div></div>${it.due ? `<span class="due">due ${esc(it.due)}</span>` : '<span></span>'}</div>`).join('')}</div>` : ''}
      <div class="actions"><button class="ok">Approve</button><button class="no">Decline</button><span class="hint">${keys.length && g.allowEdit !== false ? 'Click a value to edit it. ' : ''}Or in the terminal · <kbd>y</kbd> <kbd>n</kbd></span></div>`;
    host.prepend(card); window.scrollTo({ top: 0 });
    const answer = async (decision) => {
      const record = g.after ? { ...g.after } : null;
      if (record) for (const el of card.querySelectorAll('[data-k]')) record[el.dataset.k] = el.value;
      for (const b of card.querySelectorAll('button')) b.disabled = true;
      await fetch('/answer', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: g.id, decision, record }) });
    };
    card.querySelector('.ok').onclick = () => answer('yes');
    card.querySelector('.no').onclick = () => answer('no');
  }
  function gateDone(ev) {
    const card = $(ev.id); if (!card) return;
    for (const b of card.querySelectorAll('button')) b.disabled = true;
    for (const el of card.querySelectorAll('[data-k]')) el.disabled = true;
    const d = document.createElement('div'); d.className = 'decided ' + ev.decision; d.textContent = ev.decision === 'yes' ? '✓  Approved. Writing it now.' : '✕  Declined. Nothing was written.';
    card.querySelector('.actions').after(d);
  }
  function handle(ev) {
    if (ev.type === 'hello') { state = ev.state; t0 = Date.now() - (ev.events.at(-1)?.t || 0); render(); ev.events.forEach(handle); return; }
    if (ev.type === 'step') addStep(ev);
    if (ev.type === 'gate') addGate(ev.gate);
    if (ev.type === 'gate-done') gateDone(ev);
    if (ev.type === 'finish') { state.status = ev.status; done = true; $('clock').textContent = ms(ev.t); render(); addStep({ name: 'finish · ' + ev.status, t: ev.t, data: ev.data }); for (const d of document.querySelectorAll('.decided.yes')) d.textContent = ev.status === 'ok' ? '✓  Approved and written.' : `✓  Approved. Run ended: ${ev.status}.`; }
  }
  new EventSource('/events').onmessage = (m) => handle(JSON.parse(m.data));
</script>
</body>
</html>
